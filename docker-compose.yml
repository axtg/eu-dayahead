services:
  eu-energy-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - path: .env
        required: false # Without ENTSOE_API_KEY, prices come from the Stekker fallback
    restart: unless-stopped
